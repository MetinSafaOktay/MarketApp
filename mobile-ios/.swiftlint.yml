included:
  - App/Sources
  - App/Tests
  - App/UITests
  - Modules

excluded:
  - Derived
  - .build
  - Tuist/.build

opt_in_rules:
  - empty_count
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  ignores_comments: true

type_body_length:
  warning: 350

file_length:
  warning: 450

identifier_name:
  min_length: 2
  excluded: [id, x, y, to, at]

force_cast: warning
force_try: warning
force_unwrapping: warning
