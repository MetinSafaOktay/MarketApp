info:
  title: MarketApp API
  description: MarketApp backend API dokümantasyonu
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        profile_name:
          type: string
          maxLength: 30
        first_name:
          type: string
        last_name:
          type: string
      required:
        - password
        - profile_name
        - first_name
        - last_name
    LoginDto:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
      required:
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateProfileDto:
      type: object
      properties:
        profile_name:
          type: string
          maxLength: 30
        bio:
          type: string
        profile_photo_url:
          type: string
    CreateAddressDto:
      type: object
      properties:
        label:
          type: string
          maxLength: 50
          example: Ev
        full_address:
          type: string
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
