info:
  title: MarketApp API
  description: MarketApp backend API dokümantasyonu
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        profile_name:
          type: string
          maxLength: 30
        first_name:
          type: string
        last_name:
          type: string
      required:
        - password
        - profile_name
        - first_name
        - last_name
    LoginDto:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        password:
          type: string
      required:
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateProfileDto:
      type: object
      properties:
        profile_name:
          type: string
          maxLength: 30
        bio:
          type: string
        profile_photo_url:
          type: string
    CreateAddressDto:
      type: object
      properties:
        label:
          type: string
          maxLength: 50
          example: Ev
        full_address:
          type: string
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        is_default:
          type: boolean
      required:
        - label
        - full_address
        - city
        - district
    UpdateAddressDto:
      type: object
      properties:
        label:
          type: string
          maxLength: 50
          example: Ev
        full_address:
          type: string
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        is_default:
          type: boolean
    UpdateSettingsDto:
      type: object
      properties:
        language:
          type: string
          example: tr
        theme:
          type: string
          example: dark
        push_notifications_enabled:
          type: boolean
        order_notifications_enabled:
          type: boolean
    UpdateStoreDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 100
        tagline:
          type: string
          maxLength: 255
        description:
          type: string
        logo_url:
          type: string
        cover_image_url:
          type: string
        phone:
          type: string
          maxLength: 20
        address:
          type: string
        working_hours:
          type: object
          description: Gün bazlı çalışma saatleri (serbest JSON)
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        image_url:
          type: string
        display_order:
          type: number
          default: 0
      required:
        - name
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        image_url:
          type: string
        display_order:
          type: number
          default: 0
    CreateProductDto:
      type: object
      properties:
        category_id:
          type: string
        name:
          type: string
        sku:
          type: string
          description: Stok kodu (SKU), benzersiz olmalı
        description:
          type: string
        price:
          type: number
        original_price:
          type: number
          description: Doluysa ve price'tan büyükse ürün indirimli sayılır
        is_new_arrival:
          type: boolean
          default: false
        stock_quantity:
          type: number
          default: 0
        images:
          description: Başlangıç ürün görseli URL listesi
          type: array
          items:
            type: string
      required:
        - category_id
        - name
        - sku
        - price
    UpdateProductDto:
      type: object
      properties:
        category_id:
          type: string
        name:
          type: string
        sku:
          type: string
          description: Stok kodu (SKU), benzersiz olmalı
        description:
          type: string
        price:
          type: number
        original_price:
          type: number
          description: Doluysa ve price'tan büyükse ürün indirimli sayılır
        is_new_arrival:
          type: boolean
          default: false
        stock_quantity:
          type: number
          default: 0
    AddProductImageDto:
      type: object
      properties:
        image_url:
          type: string
        display_order:
          type: number
          default: 0
      required:
        - image_url
